name: Dealivo - refresh promotions

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh sources and remove expired offers
        run: python3 scripts/update_deals.py
      - name: Commit refreshed data
        run: |
          git config user.name 'dealivo-bot'
          git config user.email 'dealivo-bot@users.noreply.github.com'
          git add data/active-deals.json
          git diff --cached --quiet || git commit -m 'chore: refresh deal data'
          git push
