name: Dealivo - refresh promotions

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh dated offers
        run: python3 scripts/update_deals.py
      - name: Extract source-documented discount candidates
        run: python3 scripts/source_extractors.py
      - name: Commit refreshed data
        run: |
          git config user.name 'dealivo-bot'
          git config user.email 'dealivo-bot@users.noreply.github.com'
          git add data/active-deals.json data/source-offers.json
          git diff --cached --quiet || git commit -m 'chore: refresh deal data [skip ci]'
          git push
